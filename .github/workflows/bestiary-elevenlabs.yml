name: BESTIARY ElevenLabs
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode, e.g. EP17
        required: true
        type: string
      generate:
        description: Use included ElevenLabs credits and render MP4
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: bestiary-elevenlabs-${{ inputs.episode }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud render dependencies
        if: inputs.generate
        working-directory: elevenlabs
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || \
             ! test -r /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf || \
             { ! test -r /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf && \
               ! test -r /usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf; }; then
            # Use one official Ubuntu mirror instead of the runner's rotating EC2 list.
            printf '%s\n' 'https://azure.archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo timeout 100s apt-get update -q -o Acquire::http::Timeout=12 -o Acquire::Retries=1
            sudo timeout 100s apt-get install -y --no-install-recommends -o Acquire::http::Timeout=12 -o Acquire::Retries=1 ffmpeg fonts-dejavu-core fonts-liberation
          fi
          python -m pip install -r requirements.txt
      - name: Run workflow
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          EPISODE: ${{ inputs.episode }}
          GENERATE: ${{ inputs.generate }}
        working-directory: elevenlabs
        run: |
          if [[ "$GENERATE" != true ]]; then
            python bestiary.py "$EPISODE" --check
          elif [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Inspect ElevenLabs History before starting a new production dispatch.'
            exit 1
          else
            python bestiary.py "$EPISODE"
          fi
      - name: Attach verified MP4 and publishing package
        if: inputs.generate
        uses: actions/upload-artifact@v4
        with:
          name: BESTIARY-${{ inputs.episode }}
          path: elevenlabs/output/${{ inputs.episode }}/
          if-no-files-found: error
